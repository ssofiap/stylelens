apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: indexer
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          command: ["python", "-m", "indexer.build_index"]
          env:
            - name: MLFLOW_TRACKING_URI
              value: {{ .Values.mlflowUri | quote }}
            - name: MODEL_NAME
              value: {{ .Values.model.name | quote }}
            - name: MODEL_VERSION
              value: {{ required "model.version is required" .Values.model.version | quote }}
            - name: QDRANT_URL
              value: {{ .Values.qdrantUrl | quote }}
            - name: PROMOTE
              value: {{ .Values.promote | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /srv/data
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /data
            type: Directory
        - name: tmp
          emptyDir: {}